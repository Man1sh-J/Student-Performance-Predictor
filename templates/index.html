
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Performance Predictor</title>
    <style>
        * { box-sizing: border-box; }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #10172a, #243b67);
            color: white;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 24px;
        }

        .container {
            background: #ffffff;
            color: #172033;
            padding: 35px;
            border-radius: 18px;
            width: 100%;
            max-width: 460px;
            box-shadow: 0 15px 45px #0003;
        }

        h1 { text-align: center; margin-top: 0; }

        p { text-align: center; color: #667085; }

        label {
            display: block;
            margin-top: 20px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 12px;
            margin-top: 8px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-size: 16px;
        }

        button {
            width: 100%;
            padding: 14px;
            margin-top: 25px;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover { background: #1d4ed8; }

        #result {
            margin-top: 22px;
            text-align: center;
            font-size: 20px;
            font-weight: bold;
        }

        .note { font-size: 12px; margin-top: 20px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Student Performance Predictor</h1>
        <p>Predict final marks using Machine Learning</p>

        <form id="predictionForm">
            <label for="hours">Study Hours Per Day</label>
            <input id="hours" type="number" min="1" max="10"
                   step="0.1" value="5" required>

            <label for="attendance">Attendance (%)</label>
            <input id="attendance" type="number" min="50" max="100"
                   value="80" required>

            <label for="marks">Previous Exam Marks</label>
            <input id="marks" type="number" min="30" max="95"
                   value="70" required>

            <button type="submit">Predict Marks</button>
        </form>

        <div id="result" aria-live="polite"></div>

        <p class="note">
            Educational demo trained on synthetic data.
            Not validated for real student performance.
        </p>
    </div>

    <script>
        document.getElementById("predictionForm")
            .addEventListener("submit", async function(event) {
                event.preventDefault();

                const result = document.getElementById("result");
                result.textContent = "Predicting...";

                const data = {
                    study_hours: Number(document.getElementById("hours").value),
                    attendance: Number(document.getElementById("attendance").value),
                    previous_marks: Number(document.getElementById("marks").value)
                };

                try {
                    const response = await fetch("/predict", {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify(data)
                    });

                    const output = await response.json();

                    if (!response.ok) {
                        throw new Error(output.error || "Prediction failed");
                    }

                    result.textContent =
                        "Predicted Final Marks: " +
                        output.predicted_marks + "/100";
                } catch (error) {
                    result.textContent = "Error: " + error.message;
                }
            });
    </script>
</body>
</html>
